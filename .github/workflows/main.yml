name: Build Telegram APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Download Gradle distribution
        run: |
          for i in 1 2 3 4 5; do
            echo "Gradle download attempt $i/5"
            if ./gradlew --version --no-daemon; then
              echo "Gradle is available"
              exit 0
            fi

            echo "Download failed, retrying in 10 seconds..."
            sleep 10
          done

          echo "Gradle distribution could not be downloaded"
          exit 1

      - name: Build APK
        run: |
          ./gradlew assembleAfatRelease --no-daemon --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
