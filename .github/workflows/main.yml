name: Diagnose Telegram Build

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show project structure
        run: |
          echo "===== SETTINGS ====="
          find . -maxdepth 2 -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
          \) -print

          echo "===== PROJECTS ====="
          ./gradlew projects --no-daemon

      - name: Show TMessagesProj tasks
        run: |
          ./gradlew :TMessagesProj:tasks --all --no-daemon

      - name: Show jlatexmath tasks
        run: |
          ./gradlew :jlatexmath:tasks --all --no-daemon

      - name: Show Android build plugin versions
        run: |
          echo "===== AGP REFERENCES ====="
          grep -Rni \
            -E "com.android.tools.build:gradle|com.android.application|com.android.library" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="*.toml" \
            . || true

      - name: Show jlatexmath configuration
        run: |
          echo "===== JLATEXMATH REFERENCES ====="
          grep -Rni \
            -E "jlatexmath|standalone" \
            --include="settings.gradle" \
            --include="settings.gradle.kts" \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            . || true
